<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Execução</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#232a36;--txt:#e8ecf3;--sub:#8b95a7;--ok:#3ddc97;--warn:#ffb547;--ask:#ff6b8a;--off:#5b6475;--acc:#7aa7ff}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6eb;--txt:#151922;--sub:#5d6675;--off:#a3abb8;--acc:#2f6bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px}
h1{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}h1 small{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px}
.resumo{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.chip b{color:var(--txt)}.chip.on{border-color:var(--acc);color:var(--txt)}
main{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
.tema{margin:18px 0}.tema h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tit{font-weight:600;overflow-wrap:anywhere}
.est{font-size:11px;white-space:nowrap;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.trabalhando{color:var(--ok)}.parada{color:var(--warn)}.esperando-voce{color:var(--ask)}.encerrada{color:var(--off)}
.meta{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;color:var(--sub);background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:6px;padding:1px 7px}
.ped,.fim{color:var(--sub);font-size:12.5px;overflow-wrap:anywhere}.fim{border-left:2px solid var(--line);padding-left:8px}
.vazio{color:var(--sub);padding:40px 0;text-align:center}
@media (max-width:480px){header,main{padding-left:16px;padding-right:16px}.grade{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Central de Execução<small id="quando"></small></h1>
  <div class="resumo" id="filtros"></div>
</header>
<main id="lista"><p class="vazio">Lendo as sessões…</p></main>
<script>
const ROTULO={"trabalhando":"trabalhando","parada":"parada","esperando-voce":"esperando você","encerrada":"encerrada"};
let dados=null;const filtro={campo:null,valor:null};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function tempo(ms){const m=Math.round((Date.now()-ms)/60000);if(m<1)return"agora";if(m<60)return m+" min";const h=Math.round(m/60);if(h<48)return h+" h";return Math.round(h/24)+" d"}
const modeloCurto=m=>m.replace(/^claude-/,"").replace(/-\d{8}$/,"");
function passa(s){if(!filtro.campo)return true;const v=[].concat(s[filtro.campo]);return v.includes(filtro.valor)}
function chips(){const f=document.getElementById("filtros");f.replaceChildren();
  const grupo=(rotulo,campo,mapa)=>Object.entries(mapa).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{
    const c=el("span","chip"+(filtro.campo===campo&&filtro.valor===k?" on":""));c.append(rotulo==="estado"?(ROTULO[k]||k)+" ":(campo==="modelos"?modeloCurto(k):k)+" ",el("b",null,String(n)));
    c.onclick=()=>{if(filtro.campo===campo&&filtro.valor===k){filtro.campo=null}else{filtro.campo=campo;filtro.valor=k}render()};f.append(c)});
  grupo("estado","estado",dados.porEstado);grupo("","interface",dados.porInterface);grupo("","modelos",dados.porModelo);grupo("","ferramenta",dados.porFerramenta)}
function render(){if(!dados)return;chips();const L=document.getElementById("lista");L.replaceChildren();
  document.getElementById("quando").textContent=`${dados.total} sessões nas últimas ${dados.janelaHoras} h · atualizado ${new Date(dados.geradoEm).toLocaleTimeString()}`;
  let algum=false;
  for(const t of dados.temas){const ss=t.sessoes.filter(passa);if(!ss.length)continue;algum=true;
    const sec=el("section","tema");const h=el("h2",null,t.tema);h.append(el("span","tag",String(ss.length)));sec.append(h);
    const g=el("div","grade");
    for(const s of ss){const c=el("article","s");const top=el("div","top");
      top.append(el("div","tit",s.titulo||s.pedido.slice(0,80)||"(sem título)"),el("span","est "+s.estado,ROTULO[s.estado]));c.append(top);
      const m=el("div","meta");[s.ferramenta,s.interface,...s.modelos.map(modeloCurto),s.branch&&("⎇ "+s.branch),s.subagente&&"subagente","há "+tempo(s.ultima),s.tokensSaida?Math.round(s.tokensSaida/1000)+"k saída":null].filter(Boolean).forEach(x=>m.append(el("span","tag",x)));c.append(m);
      if(s.pedido)c.append(el("div","ped","Pedido: "+s.pedido));
      if(s.fimDaResposta)c.append(el("div","fim",s.fimDaResposta));
      c.title=s.pasta;g.append(c)}
    sec.append(g);L.append(sec)}
  if(!algum)L.append(el("p","vazio","Nenhuma sessão nesse recorte."))}
async function carregar(){try{const r=await fetch("/api/retrato",{cache:"no-store"});dados=await r.json();render()}catch(e){document.getElementById("quando").textContent="sem conexão com o leitor local"}}
carregar();setInterval(carregar,10000);
</script>
</body>
</html>
